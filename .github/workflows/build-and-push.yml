name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'gateway/**'
      - '.github/workflows/build-and-push.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after build'
        type: boolean
        default: false

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            gateway:
              - 'gateway/**'

  build-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Agent Core
        uses: docker/build-push-action@v6
        with:
          context: ./core
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-core:latest
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-core:${{ steps.version.outputs.tag }}
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Agent Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-gateway:latest
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-gateway:${{ steps.version.outputs.tag }}
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-core, build-gateway]
    if: always() && !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.deploy == true)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /home/unarmedpuppy/server
            sudo git pull origin main
            cd apps/agent-gateway
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
