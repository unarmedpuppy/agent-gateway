name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'gateway/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            gateway:
              - 'gateway/**'

  build-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Agent Core
        uses: docker/build-push-action@v6
        with:
          context: ./core
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-core:latest
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Agent Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-gateway:latest
            ${{ secrets.HARBOR_REGISTRY }}/library/agent-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
